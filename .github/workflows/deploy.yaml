name: Build and Deploy to Cloud Run (PROD)

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  APP_NAME: ${{ secrets.APP_NAME }}
  REGION: us-west1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log into Google Cloud
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCLOUD_AUTH }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"

      - name: Run Cloud Build
        run: |
          # Start the build in the background and check on it every 15 seconds. gcloud's own
          # wait checks once a second, which trips the project's 60-a-minute Cloud Build quota
          BUILD_ID=$(gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.APP_NAME }} --async --format='value(id)')
          echo "Cloud Build $BUILD_ID"
          for attempt in $(seq 1 120); do
              sleep 15
              # A failed check (such as a rate limit) just waits for the next one
              STATUS=$(gcloud builds describe "$BUILD_ID" --format='value(status)') || continue
              echo "$STATUS"
              case "$STATUS" in
                  SUCCESS) exit 0 ;;
                  QUEUED | PENDING | WORKING) ;;
                  *)
                      gcloud builds log "$BUILD_ID" | tail -n 50 || true
                      exit 1
                      ;;
              esac
          done
          echo "Cloud Build $BUILD_ID did not finish within 30 minutes"
          exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud config set project ${{ env.PROJECT_ID }}
          gcloud run deploy ${{ env.APP_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.APP_NAME }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
